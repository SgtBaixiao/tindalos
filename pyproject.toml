[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tindalos"
version = "0.1.0"
description = "克苏鲁 TRPG 备团系统：KP 主控 → 自适应 NPC 生成 → 分幕剧本 → 备团笔记 → 剧本节点图（LangGraph 多智能体 + eval 自进化闭环）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["agent", "langgraph", "multi-agent", "trpg", "knowledge-graph", "eval", "self-evolution", "react-flow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.2.27",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "networkx>=3.5",
    "numpy>=2",
    "pydantic>=2.12",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "PyMuPDF>=1.24",  # 仅测试夹具：构造含图 PDF 的 fixture；生产解析用 pypdfium2（AGPL §13 网络义务与 MIT 冲突，勿升为生产依赖）
    "httpx>=0.27",    # 测试构造 LLM HTTP 错误对象
]
llm = ["requests>=2.31"]
web = [
    "fastapi>=0.124",
    "uvicorn>=0.38",
    "python-multipart>=0.0.22",
    "pypdfium2>=0.13",
    "chromadb>=1.5.9",
    "Pillow>=11",
]

[project.urls]
Repository = "https://github.com/SgtBaixiao/tindalos"
Issues = "https://github.com/SgtBaixiao/tindalos/issues"

[project.scripts]
tindalos = "tindalos.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
